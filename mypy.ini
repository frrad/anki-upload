[mypy]
python_version = 3.10
# Check everything in the repo, so a new module is covered the day it lands.
# Nothing under .claude/ is listed because no code lives there any more: the
# skill is documentation, and the field rules it describes are enforced by
# fields.py, which this already covers.
files = .
exclude = (?x)(^venv/|^\.mypy_cache/|^build/)

# Everything --strict turns on, spelled out so the intent survives a mypy
# version bump changing what --strict means.
warn_unused_configs = True
disallow_any_generics = True
disallow_subclassing_any = True
disallow_untyped_calls = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
no_implicit_reexport = True
strict_equality = True
extra_checks = True

# Beyond --strict.
disallow_any_unimported = True
disallow_any_decorated = True
disallow_any_explicit = True
warn_unreachable = True
strict_bytes = True
local_partial_types = True

# Opt-in error codes that are not on by default at any strictness level.
enable_error_code =
    redundant-expr,
    possibly-undefined,
    truthy-bool,
    truthy-iterable,
    ignore-without-code,
    unused-awaitable,
    explicit-override,
    mutable-override,
    unimported-reveal,
    deprecated,
    exhaustive-match,
    redundant-self,
    narrowed-type-not-subtype

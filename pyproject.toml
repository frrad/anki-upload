[project]
name = "anki-upload"
version = "0.1.0"
description = "Read, create, and safely edit AnkiWeb notes."
requires-python = ">=3.10"
dependencies = [
    "betterproto==1.2.5",
    "platformdirs==4.4.0",
    "python-dotenv==1.1.1",
    "requests==2.32.5",
]

[dependency-groups]
dev = [
    "black==25.1.0",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "types-requests==2.33.0.20260712",
]

[tool.uv]
# This repository is a script/plugin, not an importable Python distribution.
# uv still manages and locks its runtime and development dependencies.
package = false

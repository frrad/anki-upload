name: checks

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same PR makes the in-flight run irrelevant.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install locked runtime and development dependencies
        run: uv sync --locked --all-groups

      - name: Show mypy configuration
        run: uv run --locked --all-groups mypy --config-file mypy.ini --version

      - name: Type check
        run: uv run --locked --all-groups mypy --config-file mypy.ini

      - name: Tests
        run: uv run --locked --all-groups pytest tests -v

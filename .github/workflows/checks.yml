name: checks

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same PR makes the in-flight run irrelevant.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show mypy configuration
        run: mypy --config-file mypy.ini --version

      - name: Type check
        run: mypy --config-file mypy.ini

      - name: Tests
        run: pytest tests -v
